<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Corena Gibson</title>
  <meta name="description" content="Costumes, armor, and handmade pieces by Corena Gibson — available to buy.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:   #5B0EA6;
      --purple2:  #7B2FBE;
      --purple3:  #3A0070;
      --lime:     #AAFF00;
      --lime2:    #CCFF55;
      --dark:     #0D0010;
      --white:    #FFFFFF;
      --offwhite: #F5F0FF;
      --muted:    rgba(255,255,255,0.55);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--dark);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── NAV (same as main site) ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2.5rem;
      background: rgba(13,0,16,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(170,255,0,0.2);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      color: var(--lime);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--lime); }

    section { padding: 5rem 2rem; }
    .container { max-width: 1200px; margin: 0 auto; }

    .shop-hero {
      padding: 9rem 2rem 3rem;
      text-align: center;
      background: radial-gradient(ellipse at 50% 0%, #3A0070 0%, #0D0010 65%);
    }
    .section-eyebrow {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: 0.05em;
      color: var(--white);
      margin-bottom: 1rem;
    }
    .shop-sub {
      color: var(--muted);
      font-weight: 300;
      max-width: 560px;
      margin: 0 auto;
    }
    .lime-bar {
      width: 3rem; height: 3px;
      background: var(--lime);
      margin: 1.2rem auto 0;
    }

    /* ── PRODUCT GRID ── */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(170,255,0,0.15);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s;
    }
    .product-card:hover { border-color: var(--lime); transform: translateY(-3px); }
    .product-photo-main {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: rgba(0,0,0,0.3);
      display: block;
      cursor: pointer;
    }
    .product-thumbs {
      display: flex;
      gap: 0.4rem;
      padding: 0.5rem;
      overflow-x: auto;
    }
    .product-thumbs img {
      width: 3rem; height: 3rem;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid rgba(170,255,0,0.15);
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .product-thumbs img:hover, .product-thumbs img.active { opacity: 1; border-color: var(--lime); }
    .product-body {
      padding: 1.2rem 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }
    .product-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      color: var(--white);
    }
    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--lime);
    }
    .product-desc {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      flex: 1;
    }
    .product-oos {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .buy-area { margin-top: 0.4rem; min-height: 2.75rem; }
    .buy-fallback {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      background: var(--lime);
      color: var(--dark);
      transition: background 0.2s;
    }
    .buy-fallback:hover { background: var(--lime2); }

    /* ── EMPTY / NOTICE STATES ── */
    .shop-empty, .shop-notice {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
      font-weight: 300;
      border: 1px dashed rgba(170,255,0,0.25);
      border-radius: 6px;
    }
    .shop-notice {
      margin-bottom: 2.5rem;
      background: rgba(170,255,0,0.05);
      color: var(--lime2);
      font-size: 0.85rem;
    }

    /* Lightbox (reuse gallery pattern) */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      background: rgba(13,0,16,0.95);
      justify-content: center; align-items: center;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 4px; border: 2px solid var(--lime);
      object-fit: contain;
    }
    .lightbox-close {
      position: fixed; top: 1.5rem; right: 2rem;
      font-size: 2rem; color: var(--lime); cursor: pointer;
      background: none; border: none;
      font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.1em;
    }

    footer {
      background: #050007;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      border-top: 1px solid rgba(170,255,0,0.1);
    }
    footer span { color: var(--lime); }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.2rem; }
      .nav-links { gap: 1rem; }
      .nav-links a { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/index.html">Corena Gibson</a>
  <ul class="nav-links">
    <li><a href="/index.html#about">About</a></li>
    <li><a href="/index.html#credits">Credits</a></li>
    <li><a href="/index.html#gallery">Gallery</a></li>
    <li><a href="/shop.html" class="active">Shop</a></li>
    <li><a href="/index.html#contact">Contact</a></li>
  </ul>
</nav>

<!-- SHOP HERO -->
<section class="shop-hero">
  <p class="section-eyebrow">Handmade &amp; One-of-a-Kind</p>
  <h1 class="section-title">Shop</h1>
  <p class="shop-sub">Costume pieces, armor, and props made by Corena Gibson — each one built by hand, in limited quantity.</p>
  <div class="lime-bar"></div>
</section>

<!-- PRODUCTS -->
<section id="products">
  <div class="container">
    <div id="shopNotice"></div>
    <div class="shop-grid" id="shopGrid">
      <!-- product cards injected by JS -->
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  © 2026 <span>Corena Gibson</span> &nbsp;·&nbsp; Costume Designer &amp; Fabricator &nbsp;·&nbsp; Los Angeles, CA
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕ CLOSE</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

const grid = document.getElementById('shopGrid');
const noticeBox = document.getElementById('shopNotice');

function money(n, currency) {
  try {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD' }).format(n);
  } catch (e) {
    return '$' + Number(n).toFixed(2);
  }
}

function renderEmpty() {
  grid.innerHTML = '<div class="shop-empty">New pieces are on the way — check back soon, or reach out directly via the <a href="/index.html#contact" style="color:var(--lime2);">contact page</a>.</div>';
}

function productCard(p, currency) {
  const images = (p.images && p.images.length) ? p.images : [];
  const cover = images[0] || '';
  const thumbs = images.length > 1
    ? `<div class="product-thumbs">${images.map((src, i) =>
        `<img src="${src}" alt="${escapeHtml(p.name)} view ${i+1}" data-idx="${i}" class="${i===0?'active':''}">`
      ).join('')}</div>`
    : '';

  return `
    <div class="product-card" data-images='${JSON.stringify(images).replace(/'/g, "&#39;")}'>
      ${cover ? `<img class="product-photo-main" src="${cover}" alt="${escapeHtml(p.name)}" loading="lazy">` : ''}
      ${thumbs}
      <div class="product-body">
        <div class="product-name">${escapeHtml(p.name || 'Untitled piece')}</div>
        <div class="product-price">${money(p.price || 0, currency)}</div>
        ${p.description ? `<div class="product-desc">${escapeHtml(p.description)}</div>` : ''}
        ${p.inStock === false ? '<span class="product-oos">Sold / Not Available</span>' : ''}
        <div class="buy-area" data-buy-id="${escapeHtml(p.id)}" data-price="${p.price || 0}" data-name="${escapeHtml(p.name || '')}" data-instock="${p.inStock !== false}"></div>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function wireGalleryClicks() {
  document.querySelectorAll('.product-card').forEach(card => {
    const images = JSON.parse(card.dataset.images.replace(/&#39;/g, "'") || '[]');
    const mainImg = card.querySelector('.product-photo-main');
    if (mainImg) mainImg.addEventListener('click', () => openLightbox(mainImg.src));
    card.querySelectorAll('.product-thumbs img').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const idx = Number(thumb.dataset.idx);
        if (mainImg) mainImg.src = images[idx];
        card.querySelectorAll('.product-thumbs img').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
      });
    });
  });
}

let paypalReady = null; // promise, resolves once SDK script loaded (or null if no client id)

function loadPaypalSdk(clientId, currency) {
  return new Promise((resolve, reject) => {
    if (!clientId) return resolve(false);
    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&currency=${encodeURIComponent(currency || 'USD')}&enable-funding=venmo`;
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

function renderBuyButtons(currency) {
  document.querySelectorAll('.buy-area').forEach(area => {
    const inStock = area.dataset.instock === 'true';
    const price = parseFloat(area.dataset.price || '0');
    const name = area.dataset.name || 'Item';
    const id = area.dataset.buyId;

    if (!inStock) {
      area.innerHTML = '';
      return;
    }

    if (window.paypal && price > 0) {
      const containerId = 'paypal-btn-' + id;
      area.innerHTML = `<div id="${containerId}"></div>`;
      window.paypal.Buttons({
        style: { layout: 'horizontal', height: 40, tagline: false },
        createOrder: (data, actions) => actions.order.create({
          purchase_units: [{
            description: name.slice(0, 120),
            amount: { value: price.toFixed(2), currency_code: currency || 'USD' }
          }]
        }),
        onApprove: (data, actions) => actions.order.capture().then(() => {
          area.innerHTML = '<p style="color:var(--lime,#AAFF00);font-size:0.85rem;">✓ Payment received — thank you! You\\'ll get a confirmation email from PayPal.</p>';
        }),
        onError: (err) => {
          console.error('PayPal error', err);
          area.innerHTML = '<p style="color:#ff6b6b;font-size:0.8rem;">Something went wrong loading checkout. Please contact us to complete this purchase.</p>';
        }
      }).render('#' + containerId);
    } else {
      // No PayPal configured yet — fallback to a direct contact link so nothing is unbuyable.
      const subject = encodeURIComponent('Purchase inquiry: ' + name);
      area.innerHTML = `<a class="buy-fallback" href="mailto:costumecorena1@gmail.com?subject=${subject}">Contact to Purchase</a>`;
    }
  });
}

async function init() {
  let products = [];
  let settings = { paypalClientId: '', currency: 'USD' };

  try {
    const [productsRes, settingsRes] = await Promise.all([
      fetch('/data/products.json', { cache: 'no-store' }),
      fetch('/data/settings.json', { cache: 'no-store' })
    ]);
    if (productsRes.ok) {
      const data = await productsRes.json();
      products = Array.isArray(data) ? data : (data.products || []);
    }
    if (settingsRes.ok) {
      settings = await settingsRes.json();
    }
  } catch (e) {
    console.error('Failed to load shop data', e);
  }

  if (!settings.paypalClientId) {
    noticeBox.innerHTML = `<div class="shop-notice">Online checkout isn't fully set up yet — items can still be purchased by contacting us directly.</div>`;
  }

  if (!products.length) {
    renderEmpty();
    return;
  }

  grid.innerHTML = products.map(p => productCard(p, settings.currency)).join('');
  wireGalleryClicks();

  const loaded = await loadPaypalSdk(settings.paypalClientId, settings.currency);
  renderBuyButtons(settings.currency);
  if (!loaded && settings.paypalClientId) {
    console.warn('PayPal SDK failed to load.');
  }
}

init();
</script>

</body>
</html>
